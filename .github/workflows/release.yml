name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            run_check: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            run_check: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            run_check: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            run_check: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl Tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check Binary Runs
        if: matrix.run_check
        run: ./target/${{ matrix.target }}/release/hurdler --version

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="hurdler-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/hurdler" README.md LICENSE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hurdler-${{ matrix.target }}
          path: |
            hurdler-${{ matrix.target }}.tar.gz
            hurdler-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "hurdler $TAG" \
            --generate-notes \
            $prerelease

  publish_crates:
    name: Publish crates.io
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Cargo Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish_homebrew:
    name: Publish Homebrew
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v7
        with:
          repository: cheeweisoh/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}

      - name: Download Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release download "$TAG" --repo "$REPO" --pattern '*.sha256' --dir sums

      - name: Write Formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"
          sum() { awk '{print $1}' "sums/hurdler-$1.tar.gz.sha256"; }
          mkdir -p Formula
          cat > Formula/hurdler.rb <<EOF
          class Hurdler < Formula
            desc "Terminal User Interface for Jira"
            homepage "https://github.com/$REPO"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/hurdler-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/hurdler-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$base/hurdler-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sum aarch64-unknown-linux-musl)"
              end
              on_intel do
                url "$base/hurdler-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sum x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "hurdler"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hurdler --version")
            end
          end
          EOF
          rm -rf sums

      - name: Commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/hurdler.rb; then
            echo "Formula already at ${TAG#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hurdler.rb
          git commit -m "hurdler ${TAG#v}"
          git pull --rebase
          git push
