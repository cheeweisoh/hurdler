[package]
name = "hurdler"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal User Interface for Jira"
license = "MIT"
repository = "https://github.com/cheeweisoh/hurdler"
homepage = "https://github.com/cheeweisoh/hurdler"
readme = "README.md"
keywords = ["jira", "tui", "terminal", "atlassian", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "docs/"]

[[bin]]
name = "hurdler"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.2"
